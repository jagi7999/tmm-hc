<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>House Build Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:'Baloo 2','Baloo Bhai 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Hind','Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Kannada',sans-serif;
  --bg:#E3E7EA; --paper:#FCFCFA; --paper-2:#F4F6F7; --field:#FFFFFF; --plaster:#D6DCE0;
  --ink:#1E2B37; --ink-2:#55636F; --line:#C9D0D6;
  --head:#1E2B37; --head-ink:#F3F5F6; --tape-dark:#141A20;
  --brick:#A83E2A; --brick-deep:#7E2A1A; --brick-ghost:#C3CCD2; --brick-soft:#F0D8D1;
  --auto:#F6B41A; --auto-soft:#FBECC2; --auto-ink:#7A5200;
  --indigo:#2E5E9E; --indigo-soft:#D8E4F3;
  --ok:#2A7A58; --ok-soft:#D3EADD; --due:#9A5A0B; --due-soft:#FBE6C4;
  --danger:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171C; --paper:#1B242C; --paper-2:#212C35; --field:#141B21; --plaster:#26323C;
    --ink:#E8EDF0; --ink-2:#9AA8B3; --line:#2F3C47;
    --head:#0D1216; --head-ink:#F3F5F6; --tape-dark:#0A0E11;
    --brick:#D0553B; --brick-deep:#E0654A; --brick-ghost:#33424E; --brick-soft:#3A211C;
    --auto:#F6B41A; --auto-soft:#3A3013; --auto-ink:#F6C955;
    --indigo:#7CA6E3; --indigo-soft:#1D2C42;
    --ok:#5CC08F; --ok-soft:#17332A; --due:#F0B35A; --due-soft:#3A2B10;
    --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#11171C; --paper:#1B242C; --paper-2:#212C35; --field:#141B21; --plaster:#26323C;
  --ink:#E8EDF0; --ink-2:#9AA8B3; --line:#2F3C47;
  --head:#0D1216; --head-ink:#F3F5F6; --tape-dark:#0A0E11;
  --brick:#D0553B; --brick-deep:#E0654A; --brick-ghost:#33424E; --brick-soft:#3A211C;
  --auto:#F6B41A; --auto-soft:#3A3013; --auto-ink:#F6C955;
  --indigo:#7CA6E3; --indigo-soft:#1D2C42;
  --ok:#5CC08F; --ok-soft:#17332A; --due:#F0B35A; --due-soft:#3A2B10;
  --danger:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.muted{color:var(--ink-2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 1rem}

/* header */
.top{background:var(--head);color:var(--head-ink)}
.top-inner{max-width:1120px;margin:0 auto;padding:1rem 1rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.brand-emoji{font-size:2.2rem;line-height:1}
.brand h1{font:800 1.65rem/1.1 var(--display);overflow-wrap:anywhere}
.brand p{font-size:.9rem;opacity:.75}
.top-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tape{height:11px;background:repeating-linear-gradient(-45deg,var(--auto) 0 14px,var(--tape-dark) 14px 28px)}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .75rem;border-radius:999px;font-size:.85rem;font-weight:600;background:rgba(255,255,255,.12);color:var(--head-ink);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1rem;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:.95rem;background:transparent;text-align:center}
.btn.primary{background:var(--auto);color:#1E2B37;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{border-color:currentColor;background:transparent}
.top .btn.ghost{color:var(--head-ink);border-color:rgba(255,255,255,.35)}
.btn.soft{background:var(--paper-2);border-color:var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:38px;padding:.3rem .75rem;font-size:.875rem}
.icon-btn{width:36px;height:44px;border:0;background:transparent;border-radius:8px;color:var(--ink-2);font-size:1rem}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1120px;margin:0 auto;padding:.6rem 1rem;display:flex;gap:.5rem;overflow-x:auto}
.tab{flex:0 0 auto;min-height:44px;padding:.4rem 1.05rem;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font:700 1rem var(--display);display:inline-flex;align-items:center;gap:.4rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

main{max-width:1120px;margin:0 auto;padding:1.25rem 1rem 4rem}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.page-head h2{font:800 1.6rem/1.15 var(--display)}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.search{flex:1 1 240px;max-width:420px}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.chip{min-height:38px;padding:.25rem .85rem;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.list-gap{margin-top:1rem}

/* form controls */
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .65rem;min-height:44px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.75}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem}
.card h3{font:700 1.2rem/1.2 var(--display);margin-bottom:.75rem}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.5rem;align-items:center}
.wall{display:flex;flex-direction:column;gap:4px;padding:14px;background:var(--plaster);border-radius:10px}
.wall-row{display:flex;gap:4px}
.brick{flex:2;height:24px;border-radius:3px;background:var(--brick-ghost)}
.brick.half{flex:1}
.brick.on{background:var(--brick);box-shadow:inset 0 -4px 0 rgba(0,0,0,.17),inset 0 2px 0 rgba(255,255,255,.14)}
.brick.part{background:var(--brick);opacity:.5}
.wall.over .brick.on{background:var(--brick-deep)}
@keyframes lay{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.intro .brick.on{animation:lay .45s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i) * 24ms)}
.stat-big{font:800 clamp(2.1rem,6vw,3rem)/1 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.stat-lines{display:grid;gap:.35rem;margin-top:.6rem}
.stat-lines p{font-size:1rem}
.due-chip{display:inline-flex;gap:.4rem;align-items:center;margin-top:.9rem;padding:.35rem .8rem;border-radius:999px;background:var(--due-soft);color:var(--due);font-weight:700;font-size:.95rem}
.over-chip{display:inline-flex;gap:.4rem;align-items:center;margin-top:.9rem;padding:.35rem .8rem;border-radius:6px;font-weight:700;color:#1E2B37;background:repeating-linear-gradient(-45deg,var(--auto) 0 10px,#F9CF63 10px 20px)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:1rem 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;align-items:center;border-left-width:6px}
.tile.m{border-left-color:var(--brick)}
.tile.t{border-left-color:var(--auto)}
.tile.l{border-left-color:var(--indigo)}
.tile-emoji{font-size:2rem;grid-row:span 2}
.tile b{font:800 1.5rem/1.1 var(--display);overflow-wrap:anywhere}
.tile span.lbl{color:var(--ink-2);font-size:.95rem}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start;margin-bottom:1rem}
.bar-row{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:.2rem .6rem;align-items:center;margin-bottom:.7rem}
.bar-row .b-label{font-weight:600;overflow-wrap:anywhere}
.bar-row .b-amt{font-weight:700;font-variant-numeric:tabular-nums}
.bar-track{grid-column:2 / span 2;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px}
.k-m{background:var(--brick)}.k-t{background:var(--auto)}.k-l{background:var(--indigo)}
.chart{width:100%;height:auto;display:block}
.chart .tx{fill:var(--ink-2);font:600 11px var(--body)}
.chart .tv{fill:var(--ink);font:700 11px var(--body)}
.chart .base{stroke:var(--line);stroke-width:1.5}
.bm{fill:var(--brick)}.bt{fill:var(--auto)}.bl{fill:var(--indigo)}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.6rem;font-size:.9rem;color:var(--ink-2)}
.latest{display:grid;gap:.25rem}
.latest-row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.7rem;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:.55rem .4rem;border-radius:10px;min-height:52px}
.latest-row:hover{background:var(--paper-2)}
.latest-row .l-emoji{font-size:1.5rem;text-align:center}
.latest-row b{display:block;font-weight:600;overflow-wrap:anywhere}
.latest-row small{color:var(--ink-2)}
.latest-row .amt{font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:2.2rem 1rem}
.empty .big-emoji{font-size:3rem;line-height:1.1}
.empty h3{font:800 1.5rem var(--display);margin:.4rem 0 .3rem}
.empty p{color:var(--ink-2);max-width:46ch;margin:0 auto 1rem}
.empty .btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}

/* receipts and pay slips */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.6rem 1.2rem;align-items:start}
.receipt{position:relative;background:var(--paper);padding:1rem 1.1rem 1rem;border-radius:6px 6px 0 0;margin-bottom:10px;box-shadow:0 1px 0 var(--line),0 8px 14px -10px rgba(30,43,55,.45)}
.receipt.mat{border-top:5px solid var(--brick)}
.receipt.lab{border-top:5px solid var(--indigo)}
.zig{position:absolute;left:0;bottom:-8px;width:100%;height:8px;display:block;color:var(--paper)}
.r-head{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start;margin-bottom:.6rem}
.r-head h4{font:700 1.15rem/1.2 var(--display);overflow-wrap:anywhere}
.r-head small{display:block;color:var(--ink-2);font-size:.85rem}
.badge{flex:0 0 auto;padding:.15rem .6rem;border-radius:999px;background:var(--indigo-soft);color:var(--indigo);font-weight:700;font-size:.82rem;white-space:nowrap}
.r-list{list-style:none;margin:0;padding:0;border-top:1.5px dashed var(--line)}
.r-item{display:grid;grid-template-columns:1.7rem minmax(0,1fr) auto;gap:.5rem;align-items:start;padding:.5rem 0;border-bottom:1px dashed var(--line)}
.r-emoji{font-size:1.15rem;line-height:1.5}
.r-name{font-weight:600;overflow-wrap:anywhere}
.r-name small{display:block;font-weight:400;color:var(--ink-2);font-size:.85rem}
.r-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-item.charge .r-name{color:var(--auto-ink)}
.r-total{display:flex;justify-content:space-between;align-items:baseline;padding:.65rem 0 .4rem;font:800 1.3rem var(--display)}
.r-note{font-size:.9rem;color:var(--ink-2);font-style:italic;margin-bottom:.4rem;overflow-wrap:anywhere}
.r-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.r-actions{display:flex;gap:.25rem}
.status{display:inline-flex;align-items:center;gap:.3rem;min-height:36px;padding:.15rem .8rem;border-radius:999px;border:0;font-weight:700;font-size:.9rem}
.status.paid{background:var(--ok-soft);color:var(--ok)}
.status.due{background:var(--due-soft);color:var(--due)}
.status:disabled{cursor:default}
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin-bottom:1rem}
.stat-strip .tile{border-left-width:1px;grid-template-columns:auto 1fr}
.stat-strip .tile b{font-size:1.25rem}
.stat-strip small{grid-column:2;color:var(--ink-2);font-size:.85rem}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(14,20,26,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:940px;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet.narrow{max-width:520px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.1rem .5rem}
.sheet-head h3{font:800 1.4rem var(--display)}
.sheet-body{padding:.3rem 1.1rem 1rem;overflow-y:auto;flex:1}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.8rem 1.1rem calc(.8rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper-2);border-radius:0 0 0 0}
.foot-total{display:flex;gap:.3rem 1.1rem;flex-wrap:wrap;align-items:baseline;font-size:.95rem;color:var(--ink-2)}
.foot-total strong{font:800 1.3rem var(--display);color:var(--ink)}
.foot-btns{display:flex;gap:.5rem;margin-left:auto}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-bottom:.9rem}
.fld{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.fld>span,.cell>span{font-size:.8rem;font-weight:600;color:var(--ink-2)}
fieldset.block{border:1.5px solid var(--line);border-radius:12px;padding:.7rem .8rem .8rem;margin:0 0 .9rem}
fieldset.block legend{font:700 1.05rem var(--display);padding:0 .4rem}
fieldset.block.auto{background:var(--auto-soft);border-color:var(--auto)}
.row{display:grid;gap:.6rem;align-items:end;padding:.7rem;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);margin-bottom:.6rem}
.item-row{grid-template-columns:150px minmax(0,1fr) 84px 96px 104px 108px 36px}
.crew-row.daily{grid-template-columns:130px minmax(0,1fr) 90px 110px 112px 36px}
.crew-row.weekly{grid-template-columns:130px minmax(0,1fr) 84px 104px 76px 110px 36px}
.crew-row.once{grid-template-columns:130px minmax(0,1fr) 90px 140px 36px}
.cell{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.cell output{min-height:44px;display:flex;align-items:center;font:700 1.05rem var(--display);font-variant-numeric:tabular-nums}
.add-row{display:flex;gap:.5rem;flex-wrap:wrap}
.seg{display:flex;gap:.4rem}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.paytypes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-bottom:.9rem}
.paytype{border:2px solid var(--line);background:var(--field);border-radius:12px;padding:.6rem .5rem;text-align:center;display:grid;gap:.1rem}
.paytype .pe{font-size:1.6rem;line-height:1.1}
.paytype b{font:700 1rem var(--display)}
.paytype small{color:var(--ink-2);font-size:.78rem;line-height:1.25}
.paytype[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft)}
.err{background:var(--brick-soft);color:var(--brick);border-radius:8px;padding:.5rem .75rem;font-weight:600;margin-bottom:.8rem}
.settings-sec{padding:.9rem 0;border-top:1px solid var(--line)}
.settings-sec:first-child{border-top:0;padding-top:0}
.settings-sec h4{font:700 1.1rem var(--display);margin-bottom:.4rem}
.settings-sec p.muted{font-size:.9rem;margin-bottom:.6rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:901px){
  .backdrop{align-items:center;padding:1rem}
  .sheet{border-radius:18px;max-height:90vh;max-height:90dvh}
  .sheet-foot{border-radius:0 0 18px 18px}
}
@media (max-width:900px){
  .hero,.grid2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item-row,.crew-row.daily,.crew-row.weekly,.crew-row.once{grid-template-columns:repeat(6,minmax(0,1fr))}
  .c-cat,.c-name{grid-column:span 6}
  .c-qty,.c-unit,.c-rate{grid-column:span 2}
  .c-out{grid-column:span 5}
  .c-x{grid-column:span 1;justify-self:end}
  .crew-row .c-g,.crew-row .c-r{grid-column:span 3}
  .crew-row.daily .c-n,.crew-row.daily .c-rate{grid-column:span 3}
  .crew-row.weekly .c-n,.crew-row.weekly .c-rate,.crew-row.weekly .c-days{grid-column:span 2}
  .crew-row.once .c-n{grid-column:span 2}
  .crew-row.once .c-amt{grid-column:span 4}
  .crew-row.once .c-x{grid-column:span 6}
}
@media (max-width:520px){
  .paytype small{display:none}
  .brand h1{font-size:1.4rem}
  .stat-strip .tile{grid-template-columns:1fr}
  .stat-strip .tile-emoji{grid-row:auto}
  .stat-strip small{grid-column:1}
}
@media (prefers-reduced-motion:reduce){
  .intro .brick.on{animation:none}
  .toast{transition:none}
}

/* snapshot restore bar */
.seedbar{max-width:1120px;margin:1rem auto 0;padding:0 1rem}
.seedbar .box{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;background:var(--due-soft);color:var(--ink);border:1.5px solid var(--auto);border-radius:14px;padding:.8rem 1rem}
.seedbar .box p{flex:1 1 260px;font-size:.95rem}
.seedbar .box .add-row{margin-left:auto}
.seedbar .box.ok{background:var(--ok-soft);border-color:var(--ok)}
.seedbar .box.bad{background:var(--brick-soft);border-color:var(--brick)}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-emoji" aria-hidden="true">🏗️</span>
      <div>
        <h1 id="projName">My House Build</h1>
        <p>Materials, labour and transport in one place</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill" id="syncChip">⏳ Connecting…</span>
      <span class="pill" id="roleChip">🛠️ Admin mode</span>
      <button class="btn ghost small" id="lockBtn" data-act="lock" hidden></button>
      <button class="btn ghost small" data-act="settings">⚙️ Settings</button>
    </div>
  </div>
  <div class="tape" aria-hidden="true"></div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" role="tablist" id="tabs"></div>
</nav>
<div class="seedbar" id="seedBar" hidden></div>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- reference data ---------- */

/* canonical JSON (sorted keys) so the same record always produces the same text */
function canon(v){
  if(v===undefined)return 'null';
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';
  return JSON.stringify(v);
}
function snapshotMap(s){
  var m={};
  s.bills.forEach(function(b){m['bill:'+b.id]=canon(b)});
  s.labour.forEach(function(e){m['labour:'+e.id]=canon(e)});
  m['set:name']=String(s.settings.name||'');
  m['set:budget']=String(num(s.settings.budget));
  m['set:pin']=String(s.settings.pin||'');
  return m;
}
function diffOps(cur,bs){
  var ops=[],k;
  for(k in cur){if(bs[k]!==cur[k])ops.push({k:k,v:cur[k]})}
  for(k in bs){if(!(k in cur))ops.push({k:k,del:true})}
  return ops;
}
var pendingCount=function(){return diffOps(snapshotMap(state),base).length};
function applyOp(s,op){
  var p=op.k.indexOf(':'),kind=op.k.slice(0,p),id=op.k.slice(p+1);
  if(kind==='set'){if(id==='budget')s.settings.budget=num(op.v);else s.settings[id]=op.v;return}
  var arr=kind==='bill'?s.bills:s.labour;
  var i=arr.findIndex(function(x){return x.id===id});
  if(op.del){if(i>=0)arr.splice(i,1);return}
  var obj;try{obj=JSON.parse(op.v)}catch(e){return}
  if(i>=0)arr[i]=obj;else arr.push(obj);
}

/* Turso HTTP pipeline (Hrana over HTTP) */
var T=function(s){return {type:'text',value:String(s)}};
var I=function(n){return {type:'integer',value:String(n)}};
async function tursoRun(stmts){
  var reqs=stmts.map(function(s){return {type:'execute',stmt:{sql:s.sql,args:s.args||[]}}});
  reqs.push({type:'close'});
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},25000),res;
  try{
    res=await fetch(DB_URL+'/v2/pipeline',{method:'POST',headers:{'Authorization':'Bearer '+CONFIG.token,'Content-Type':'application/json'},body:JSON.stringify({requests:reqs}),signal:ctl.signal});
  }catch(e){
    throw new Error(e&&e.name==='AbortError'?'The database took too long to answer.':'Can’t reach the database. Check your internet connection.');
  }finally{clearTimeout(to)}
  if(!res.ok){
    var t='';try{t=await res.text()}catch(e){}
    throw new Error(res.status===401||res.status===403?'The database rejected the access token.':'The database answered with an error ('+res.status+')'+(t?': '+t.slice(0,140):''));
  }
  var j=await res.json(),out=[];
  for(var i=0;i<stmts.length;i++){
    var r=(j.results||[])[i];
    if(r&&r.type==='ok')out.push({ok:true,rows:((r.response&&r.response.result&&r.response.result.rows)||[]).map(function(row){return row.map(function(c){return c&&c.type!=='null'?c.value:null})})});
    else out.push({ok:false,error:(r&&r.error&&r.error.message)||'Unknown database error'});
  }
  return out;
}
async function ensureSchema(){
  var r=await tursoRun([
    {sql:'CREATE TABLE IF NOT EXISTS hb_records (id TEXT PRIMARY KEY, kind TEXT NOT NULL, data TEXT NOT NULL, updated_at INTEGER NOT NULL)'},
    {sql:'CREATE TABLE IF NOT EXISTS hb_settings (k TEXT PRIMARY KEY, v TEXT NOT NULL)'},
    {sql:'CREATE INDEX IF NOT EXISTS hb_records_kind ON hb_records(kind)'}
  ]);
  r.forEach(function(x){if(!x.ok)throw new Error(x.error)});
  schemaReady=true;
}
async function fetchRemote(){
  var r=await tursoRun([{sql:'SELECT id, kind, data FROM hb_records'},{sql:'SELECT k, v FROM hb_settings'}]);
  if(!r[0].ok)throw new Error(r[0].error);
  if(!r[1].ok)throw new Error(r[1].error);
  var s=emptyState(),bills=[],labour=[];
  r[0].rows.forEach(function(row){
    var o;try{o=JSON.parse(row[2])}catch(e){return}   /* unreadable rows are left alone in the database, never deleted */
    if(!o||typeof o!=='object')return;
    o.id=o.id||row[0];
    (row[1]==='bill'?bills:row[1]==='labour'?labour:[]).push(o);
  });
  r[1].rows.forEach(function(row){
    if(row[0]==='name')s.settings.name=row[1];
    else if(row[0]==='budget')s.settings.budget=num(row[1]);
    else if(row[0]==='pin')s.settings.pin=row[1];
  });
  s.bills=bills;s.labour=labour;
  return normalize(s);
}

/* local copy, used for offline start and to keep unsent changes safe */
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({state:state,base:base}))}catch(e){}}
function loadCache(){
  try{var r=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(r&&r.state&&r.base)return {state:normalize(r.state),base:r.base}}catch(e){}
  return null;
}

/* pull from Turso, then lay any not-yet-sent local changes on top so nothing is lost */
async function syncFromRemote(){
  if(syncBusy||flushing)return false;
  syncBusy=true;
  try{
    if(!schemaReady)await ensureSchema();
    var remote=await fetchRemote();
    /* no awaits below this line, so an edit can't slip in between reading and replacing state */
    var pending=diffOps(snapshotMap(state),base);
    var next=remote;
    pending.forEach(function(op){applyOp(next,op)});
    var changed=canon(snapshotMap(next))!==canon(snapshotMap(state));
    base=snapshotMap(remote);
    state=next;
    baseKnown=true;connected=true;loadError='';
    saveCache();
    return changed;
  }catch(e){
    connected=false;loadError=e&&e.message?e.message:'Can’t reach the database.';
    return false;
  }finally{syncBusy=false}
}
function opToStmt(op){
  var p=op.k.indexOf(':'),kind=op.k.slice(0,p),id=op.k.slice(p+1);
  if(kind==='set')return {sql:'INSERT INTO hb_settings (k, v) VALUES (?, ?) ON CONFLICT(k) DO UPDATE SET v = excluded.v',args:[T(id),T(op.v)]};
  if(op.del)return {sql:'DELETE FROM hb_records WHERE id = ?',args:[T(id)]};
  return {sql:'INSERT INTO hb_records (id, kind, data, updated_at) VALUES (?, ?, ?, ?) ON CONFLICT(id) DO UPDATE SET kind = excluded.kind, data = excluded.data, updated_at = excluded.updated_at',args:[T(id),T(kind),T(op.v),I(Date.now())]};
}
function flush(){
  if(!baseKnown)return Promise.resolve(false);
  if(flushing){flushAgain=true;return flushPromise||Promise.resolve(false)}
  if(syncBusy)return new Promise(function(res){setTimeout(function(){res(flush())},250)});
  flushPromise=doFlush();
  return flushPromise;
}
async function doFlush(){
  flushing=true;updateSyncChip();
  var ok=true;
  try{
    if(!schemaReady)await ensureSchema();
    do{
      flushAgain=false;
      var ops=diffOps(snapshotMap(state),base);
      for(var i=0;i<ops.length&&ok;i+=40){
        var chunk=ops.slice(i,i+40);
        var res=await tursoRun(chunk.map(opToStmt));
        chunk.forEach(function(op,j){
          if(res[j]&&res[j].ok){if(op.del)delete base[op.k];else base[op.k]=op.v}
          else ok=false;
        });
      }
      saveCache();
    }while(flushAgain&&ok);
  }catch(e){ok=false;loadError=e&&e.message?e.message:'Can’t reach the database.'}
  flushing=false;
  if(ok){connected=true;loadError=''}else{connected=false;scheduleRetry()}
  updateSyncChip();
  return ok;
}
function persist(){
  state.updatedAt=Date.now();
  saveCache();
  updateSyncChip();
  if(!baseKnown)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,350);
}
function scheduleRetry(){
  if(retryTimer)return;
  retryTimer=setTimeout(async function(){
    retryTimer=null;
    if(flushing||syncBusy){scheduleRetry();return}
    var changed=await syncFromRemote();
    booted=true;
    if((changed||!baseKnown)&&!$('#backdrop'))render();
    if(connected)flush();else scheduleRetry();
    updateSyncChip();
  },8000);
}
function pollOnce(){
  if(document.hidden||!booted||$('#backdrop')||flushing||syncBusy)return;
  var ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  syncFromRemote().then(function(changed){
    if(changed)render();
    if(connected&&pendingCount())flush();
    else if(!connected)scheduleRetry();
    updateSyncChip();
  });
}
async function retryNow(){
  toast('Checking the database…');
  await syncFromRemote();
  booted=true;
  if(connected)await flush();
  render();
  toast(connected?'Synced with Turso':'Still offline');
}
async function boot(){
  var c=loadCache();
  if(c){state=c.state;base=c.base;baseKnown=true}
  render();
  await syncFromRemote();
  booted=true;
  render();
  if(connected)flush();else scheduleRetry();
}
function updateSyncChip(){
  var c=$('#syncChip');if(!c)return;
  var n=baseKnown?pendingCount():0,t;
  if(!booted)t='⏳ Connecting…';
  else if(flushing||(connected&&n))t='⏳ Saving…';
  else if(!connected)t='⚠️ Offline'+(n?', '+n+' waiting to sync':'');
  else t='☁️ Synced with Turso';
  c.textContent=t;
}

/* admin PIN: stored as a hash, checked in the browser (a convenience lock, not real security) */
async function hashPin(p){
  try{
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hbt:'+p));
    return 'h1:'+Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
  }catch(e){return 'p:'+p}
}
async function pinOk(input){
  var s=String(state.settings.pin||'');
  if(s.indexOf('h1:')===0||s.indexOf('p:')===0)return (await hashPin(input))===s;
  return input===s;
}

function totals(){
  var t={mat:0,trans:0,lab:0,due:0,men:0,women:0,menDays:0,womenDays:0};
  state.bills.forEach(function(b){
    var i=billItems(b),tr=billTransport(b);
    t.mat+=i;t.trans+=tr;
    if(b.status==='due')t.due+=i+tr;
  });
  state.labour.forEach(function(e){
    var s=0;
    e.lines.forEach(function(l){
      var a=lineAmt(e,l);s+=a;
      if(l.gender==='women'){t.women+=a;t.womenDays+=personDays(e,l)}
      else{t.men+=a;t.menDays+=personDays(e,l)}
    });
    t.lab+=s;
    if(e.status==='due')t.due+=s;
  });
  t.total=t.mat+t.trans+t.lab;
  return t;
}

function wallHTML(frac){
  var rows=[],idx=0,r;
  for(r=0;r<6;r++){
    var kinds=r%2===1?['h','f','f','f','f','f','f','h']:['f','f','f','f','f','f','f'];
    rows.push(kinds.map(function(k){return {k:k,i:idx++}}));
  }
  var filled=Math.max(0,Math.min(1,frac))*idx;
  return rows.slice().reverse().map(function(row){
    return '<div class="wall-row">'+row.map(function(b){
      var c='brick'+(b.k==='h'?' half':'');
      if(b.i+1<=filled+1e-9)c+=' on';else if(b.i<filled)c+=' part';
      return '<span class="'+c+'" style="--i:'+b.i+'"></span>';
    }).join('')+'</div>';
  }).join('');
}

      '<div class="bar-track"><i class="k-'+r.k+'" style="width:'+Math.max(2,r.a/max*100)+'%"></i></div></div>';
  }).join('');

function weeklyChartHTML(){
  var map={};
  function add(ds,k,a){var d=parseD(ds);if(!d||!a)return;var w=isoD(weekStart(d));if(!map[w])map[w]={m:0,t:0,l:0};map[w][k]+=a}
  state.bills.forEach(function(b){add(b.date,'m',billItems(b));add(b.date,'t',billTransport(b))});
  state.labour.forEach(function(e){add(e.date,'l',labourTotal(e))});
  var keys=Object.keys(map);
  if(!keys.length)return '<p class="muted">Weekly totals appear here once you add entries.</p>';
  var lastW=weekStart(new Date());
  keys.forEach(function(k){var d=parseD(k);if(d>lastW)lastW=d});
  var weeks=[],i;
  for(i=7;i>=0;i--)weeks.push(addDays(lastW,-7*i));
  var vals=weeks.map(function(d){var m=map[isoD(d)]||{m:0,t:0,l:0};return {d:d,m:m.m,t:m.t,l:m.l,s:m.m+m.t+m.l}});
  var max=Math.max.apply(null,vals.map(function(v){return v.s}).concat([1]));
  var W=640,H=230,pl=8,pr=8,pt=26,pb=32,bw=(W-pl-pr)/8,bar=bw*0.6,ch=H-pt-pb;
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending in each of the last 8 weeks">';
  out+='<line class="base" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  vals.forEach(function(v,n){
    var x=pl+n*bw+(bw-bar)/2,y=H-pb;
    [['m','bm'],['t','bt'],['l','bl']].forEach(function(p){
      var h=v[p[0]]/max*ch;
      if(h>0){y-=h;out+='<rect class="'+p[1]+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>'}
    });
    if(v.s>0)out+='<text class="tv" x="'+(x+bar/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+compact(v.s)+'</text>';
    out+='<text class="tx" x="'+(x+bar/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+fmtShort(v.d)+'</text>';
  });
  out+='</svg><div class="legend"><span>🧱 Materials</span><span>🛺 Transport</span><span>👷 Labour</span><span>Weeks start on Monday</span></div>';
  return out;
}

function openSheet(title,body,foot,narrow){

  lastFocus=document.activeElement;
  document.body.appendChild(w);
  document.body.classList.add('noscroll');
  var f=w.querySelector('[data-first]')||w.querySelector('input,select,textarea');

async function restoreBackup(){
  var msg=$('#backupMsg'),o;
  try{
    o=JSON.parse($('#backupTxt').value);
    if(!o||typeof o!=='object'||!Array.isArray(o.bills)||!Array.isArray(o.labour))throw new Error('shape');
  }catch(e){
    msg.innerHTML='<div class="err" role="alert" style="margin-top:.6rem">That text isn’t a valid backup. Paste the full backup text, starting with a curly bracket.</div>';return;
  }
  var inc=normalize(o),nb=0,nl=0,upd=0;
  var put=function(arr,x){var i=arr.findIndex(function(y){return y.id===x.id});if(i>=0){arr[i]=x;upd++;return 0}arr.push(x);return 1};
  inc.bills.forEach(function(b){nb+=put(state.bills,b)});
  inc.labour.forEach(function(e){nl+=put(state.labour,e)});
  if((!state.settings.name||state.settings.name==='My House Build')&&inc.settings.name)state.settings.name=inc.settings.name;
  if(!num(state.settings.budget)&&num(inc.settings.budget))state.settings.budget=num(inc.settings.budget);
  if(!state.settings.pin&&inc.settings.pin){
    var p=String(inc.settings.pin);
    state.settings.pin=/^(h1:|p:)/.test(p)?p:await hashPin(p);
    unlocked=true;try{sessionStorage.setItem('hbt-unlocked','1')}catch(e){}
  }
  persist();render();
  msg.innerHTML='<p class="muted" style="margin-top:.6rem">Sending to the database…</p>';
  var ok=await flush();
  msg=$('#backupMsg');if(!msg)return;
  msg.innerHTML=ok?'<div class="err" style="margin-top:.6rem;background:var(--ok-soft);color:var(--ok)" role="status">✅ Saved to the database: '+nb+' new bills, '+nl+' new labour payments, '+upd+' already there and refreshed.</div>'
    :'<div class="err" role="alert" style="margin-top:.6rem">Imported on this device, but the database didn’t answer. It will sync automatically once the connection is back.</div>';
}

/* export */
function csvCell(v){
  if(typeof v==='number')return String(v);
  var s=String(v==null?'':v);
  if(/^[=+\-@]/.test(s))s="'"+s;
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function buildCSV(){
  var rows=[['Section','Date','Supplier or work','Description','Group','Quantity','Unit or days','Rate','Amount','Status','Note']];
  state.bills.forEach(function(b){
    b.items.forEach(function(i){rows.push(['Material',b.date,b.supplier,i.name||catOf(i.cat).label,catOf(i.cat).label,num(i.qty),i.unit,num(i.rate),itemAmt(i),b.status,b.note])});
    if(num(b.transport)>0)rows.push(['Transport',b.date,b.supplier,vehOf(b.vehicle).label+' charge','Transport','','','',num(b.transport),b.status,b.note]);
    if(num(b.loading)>0)rows.push(['Transport',b.date,b.supplier,'Loading and unloading','Transport','','','',num(b.loading),b.status,b.note]);
  });
  state.labour.forEach(function(e){
    e.lines.forEach(function(l){rows.push(['Labour ('+payOf(e.payType).label.toLowerCase()+')',e.date,e.area||e.contractor,l.role,genOf(l.gender).label,num(l.count),e.payType==='once'?'':num(l.days)||1,e.payType==='once'?'':num(l.rate),lineAmt(e,l),e.status,e.note])});
  });
  return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function doExport(){
  saveFile('house-expenses-'+today()+'.csv',buildCSV(),'text/csv;charset=utf-8');
  toast('CSV exported');
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(act){
    case 'tab':ui.tab=v;render();window.scrollTo(0,0);break;
    case 'mstatus':ui.mstatus=v;render();break;
    case 'mcat':ui.mcat=v;render();break;
    case 'lpay':ui.lpay=v;render();break;
    case 'lstatus':ui.lstatus=v;render();break;
    case 'clear-m':ui.mq='';ui.mstatus='all';ui.mcat='all';render();break;
    case 'clear-l':ui.lq='';ui.lpay='all';ui.lstatus='all';render();break;
    case 'add-bill':openBillSheet();break;
    case 'edit-bill':openBillSheet(id);break;
    case 'del-bill':confirmDelete('bill',id);break;
    case 'toggle-bill':
      if(isAdmin()){var b=state.bills.filter(function(x){return x.id===id})[0];if(b){b.status=b.status==='due'?'paid':'due';persist();render();toast(b.status==='due'?'Marked as due':'Marked as paid')}}
      break;
    case 'add-labour':openLabourSheet();break;
    case 'edit-labour':openLabourSheet(id);break;
    case 'del-labour':confirmDelete('labour',id);break;
    case 'toggle-labour':
      if(isAdmin()){var e2=state.labour.filter(function(x){return x.id===id})[0];if(e2){e2.status=e2.status==='due'?'paid':'due';persist();render();toast(e2.status==='due'?'Marked as due':'Marked as paid')}}
      break;
    case 'do-delete':
      if(sheet&&sheet.type==='delete'&&isAdmin()){
        var kind=sheet.kind,did=sheet.id;
        if(kind==='bill')state.bills=state.bills.filter(function(x){return x.id!==did});else state.labour=state.labour.filter(function(x){return x.id!==did});
        persist();closeSheet();render();toast(kind==='bill'?'Bill deleted':'Payment deleted');
      }
      break;
    case 'close':closeSheet();break;
    case 'set-status':if(draft){draft.status=v;$('#statusHost').innerHTML=statusSeg(v)}break;
    case 'add-item':if(draft){draft.items.push(newItem());renderBillRows(true)}break;
    case 'del-item':if(draft&&draft.items.length>1){draft.items.splice(+el.dataset.i,1);renderBillRows()}break;
    case 'save-bill':saveBill();break;
    case 'set-paytype':if(draft){draft.payType=v;applyPayType()}break;
    case 'add-crew':
      if(draft){var nl=newLine(el.dataset.g);var s=draft.payType==='once'?0:suggestRate(nl.role,nl.gender);if(s)nl.rate=String(s);draft.lines.push(nl);renderCrewRows(true)}
      break;
    case 'del-crew':if(draft&&draft.lines.length>1){draft.lines.splice(+el.dataset.i,1);renderCrewRows()}break;
    case 'save-labour':saveLabour();break;
    case 'settings':openSettings();break;
    case 'save-settings':if(isAdmin())saveSettings();break;
    case 'lock':unlocked=false;try{sessionStorage.removeItem('hbt-unlocked')}catch(e){}render();toast('Admin locked');break;
    case 'unlock-sheet':openUnlock();break;
    case 'unlock':doUnlock();break;
    case 'export':doExport();break;
    case 'copy-backup':
      (function(){var ta=$('#backupTxt');ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}
        $('#backupMsg').innerHTML='<p class="muted" style="margin-top:.5rem">'+(ok?'Backup copied.':'Select the text above and copy it manually.')+'</p>'})();
      break;
    case 'restore':if(isAdmin())restoreBackup();break;
    case 'sample':if(isAdmin())loadSample();break;
    case 'reset-ask':if(isAdmin())askReset();break;
    case 'reset-go':if(isAdmin())doReset();break;
    case 'remove-pin':if(isAdmin())removePin();break;
    case 'download-backup':saveFile('house-build-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded');break;
    case 'seed-restore':if(isAdmin()){if(sheet&&sheet.type==='snapguard')closeSheet();restoreSeed()}break;
    case 'seed-dismiss':try{localStorage.setItem(seedDismissKey,seedSig())}catch(e){}updateSeedBar();break;
    case 'seed-ok':seedResult=null;updateSeedBar();break;
    case 'snapshot-html':downloadSnapshotHtml(false);break;
    case 'snapshot-force':closeSheet();downloadSnapshotHtml(true);break;
    case 'sync-now':retryNow();break;
    case 'retry-connect':retryNow();break;
  }
});

document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='mQ'){ui.mq=t.value;$('#matList').innerHTML=matListHTML();return}
  if(t.id==='lQ'){ui.lq=t.value;$('#labList').innerHTML=labListHTML();return}
  if(!sheet||!draft||!t.closest('.sheet'))return;
  var r=t.dataset.r,k=t.dataset.k,row=t.closest('[data-i]');
  if(sheet.type==='bill'){
    if(r&&row){
      var it=draft.items[+row.dataset.i];if(!it)return;
      it[r]=t.value;
      if(r==='cat'){var ph=row.querySelector('[data-r="name"]');if(ph)ph.placeholder=catOf(t.value).ph}
      row.querySelector('output').textContent=money(itemAmt(it));
      updateBillTotals();
    }else if(k){draft[k]=t.value;if(k==='transport'||k==='loading')updateBillTotals()}
  }else if(sheet.type==='labour'){
    if(r&&row){
      var l=draft.lines[+row.dataset.i];if(!l)return;
      l[r]=t.value;
      if((r==='role'||r==='gender')&&draft.payType!=='once'&&!num(l.rate)){
        var s=suggestRate(l.role,l.gender);
        if(s){l.rate=String(s);var ri=row.querySelector('[data-r="rate"]');if(ri)ri.value=s}
      }
      var out=row.querySelector('output');if(out)out.textContent=money(lineAmt(draft,l));
      updateLabourTotals();
    }else if(k)draft[k]=t.value;
  }
});

  if(ev.key==='Escape'&&$('#backdrop'))closeSheet();

/* ---------- snapshot inside this file: restore Turso from JSON, and write a new single-file copy ---------- */
/* The block <script id="hbt-seed"> holds a JSON copy of the database. Restoring only ever ADDS records that
   the database is missing (matched by id). It never deletes, and never overwrites a record that exists. */
var seedDismissKey='hbt-seed-dismissed',seedBusy=false,seedResult=null;
function readSeed(){
  try{
    var el=document.getElementById('hbt-seed');if(!el)return null;
    var o=JSON.parse(el.textContent||'null');if(!o||typeof o!=='object')return null;
    var n=normalize(o);
    if(!n.bills.length&&!n.labour.length)return null;
    return {data:n,exportedAt:o.exportedAt||null};
  }catch(e){return null}
}
var SEED=readSeed();
function seedSig(){return SEED?(SEED.exportedAt||'')+'|'+SEED.data.bills.length+'|'+SEED.data.labour.length:''}
function seedDismissed(){try{return localStorage.getItem(seedDismissKey)===seedSig()}catch(e){return false}}
function seedDate(){if(!SEED||!SEED.exportedAt)return '';var d=new Date(SEED.exportedAt);return isFinite(d)?fmtDate(isoD(d)):''}
function seedMissing(){
  var have={};
  state.bills.forEach(function(b){have['bill:'+b.id]=1});
  state.labour.forEach(function(e){have['labour:'+e.id]=1});
  if(!SEED)return {bills:[],labour:[]};
  return {
    bills:SEED.data.bills.filter(function(b){return !have['bill:'+b.id]}),
    labour:SEED.data.labour.filter(function(e){return !have['labour:'+e.id]})
  };
}
function seedSettingsPatch(){
  var p={};if(!SEED)return p;
  var s=SEED.data.settings,c=state.settings;
  if((!c.name||c.name==='My House Build')&&s.name&&s.name!=='My House Build')p.name=s.name;
  if(!num(c.budget)&&num(s.budget))p.budget=num(s.budget);
  if(!c.pin&&s.pin)p.pin=String(s.pin);
  return p;
}
function seedPendingCount(){var m=seedMissing();return m.bills.length+m.labour.length+Object.keys(seedSettingsPatch()).length}
function updateSeedBar(){
  var bar=$('#seedBar');if(!bar)return;
  if(seedResult){
    bar.hidden=false;
    bar.innerHTML='<div class="box'+(seedResult.kind?' '+seedResult.kind:'')+'" role="status"><p>'+seedResult.html+'</p>'+(seedBusy?'':'<div class="add-row"><button class="btn soft small" data-act="seed-ok">OK</button></div>')+'</div>';
    return;
  }
  if(!SEED||!booted||!connected||!baseKnown||!isAdmin()||seedDismissed()){bar.hidden=true;bar.innerHTML='';return}
  var m=seedMissing(),n=m.bills.length+m.labour.length,extra=Object.keys(seedSettingsPatch()).length;
  if(!n&&!extra){bar.hidden=true;bar.innerHTML='';return}
  var what=[];
  if(m.bills.length)what.push(m.bills.length+(m.bills.length===1?' bill':' bills'));
  if(m.labour.length)what.push(m.labour.length+(m.labour.length===1?' labour payment':' labour payments'));
  if(extra)what.push('some settings');
  bar.hidden=false;
  bar.innerHTML='<div class="box"><p>📦 This file carries a saved copy of your data'+(seedDate()?' from '+esc(seedDate()):'')+'. The database is missing <b>'+esc(what.join(', '))+'</b>. Restoring only adds what is missing; nothing is deleted or overwritten.</p>'+
    '<div class="add-row"><button class="btn primary small" data-act="seed-restore">Restore to Turso</button><button class="btn ghost small" data-act="seed-dismiss">Not now</button></div></div>';
}
function seedNote(html,kind){
  seedResult={html:html,kind:kind||''};
  updateSeedBar();
  var m=$('#seedMsg');
  if(m)m.innerHTML='<div class="err" role="status" style="margin-top:.6rem;'+(kind==='ok'?'background:var(--ok-soft);color:var(--ok)':'')+'">'+html+'</div>';
}
async function restoreSeed(){
  if(!isAdmin()||!SEED||seedBusy)return;
  seedBusy=true;
  try{
    seedNote('⏳ Checking what the database already has…');
    await syncFromRemote();
    if(!connected){seedNote('⚠️ Can’t reach the database, so nothing was changed. Try again when you are online.','bad');return}
    var m=seedMissing(),sp=seedSettingsPatch(),pinVal=null;
    if(sp.pin)pinVal=/^(h1:|p:)/.test(sp.pin)?sp.pin:await hashPin(sp.pin);
    var keys=[];
    /* everything below is synchronous, so no edit can slip in half way */
    m=seedMissing();
    m.bills.forEach(function(b){state.bills.push(clone(b));keys.push('bill:'+b.id)});
    m.labour.forEach(function(e){state.labour.push(clone(e));keys.push('labour:'+e.id)});
    var sk=Object.keys(sp);
    if(sp.name)state.settings.name=sp.name;
    if(sp.budget)state.settings.budget=sp.budget;
    if(pinVal){state.settings.pin=pinVal;unlocked=true;try{sessionStorage.setItem('hbt-unlocked','1')}catch(e){}}
    if(!keys.length&&!sk.length){seedNote('✅ Nothing to restore. Everything in this file is already in the database.','ok');return}
    persist();
    seedNote('⏳ Sending '+keys.length+' record'+(keys.length===1?'':'s')+' to Turso…');
    var ok=await flush();
    if(!ok){seedNote('⚠️ Restored on this device, but the database did not answer. It will sync by itself once the connection is back, so nothing is lost.','bad');return}
    /* read it back from Turso and compare, so “saved” means saved */
    var remote=await fetchRemote(),rm=snapshotMap(remote),cur=snapshotMap(state),bad=0;
    keys.forEach(function(k){if(rm[k]!==cur[k])bad++});
    if(bad)seedNote('⚠️ '+bad+' of '+keys.length+' records did not read back from Turso. Nothing was removed; press Restore again.','bad');
    else seedNote('✅ Restored '+m.bills.length+' bills and '+m.labour.length+' labour payments'+(sk.length?' plus settings':'')+'. Read back from Turso and verified.','ok');
  }catch(e){
    seedNote('⚠️ Something went wrong: '+esc(e&&e.message?e.message:'unknown error')+'. Nothing was deleted.','bad');
  }finally{seedBusy=false;render()}
}
function snapshotSecHTML(){
  var s='<div class="settings-sec"><h4>📦 Single-file snapshot</h4>';
  if(SEED){
    var mm=seedMissing(),rec=mm.bills.length+mm.labour.length,ex=Object.keys(seedSettingsPatch()).length,n=rec+ex;
    var gap=(rec?rec+(rec===1?' record':' records'):'')+(rec&&ex?' and ':'')+(ex?'some settings':'');
    s+='<p class="muted">The data saved inside this file ('+SEED.data.bills.length+' bills, '+SEED.data.labour.length+' labour payments'+(seedDate()?', taken '+esc(seedDate()):'')+') '+(n?'has <b>'+esc(gap)+'</b> the database doesn’t have yet.':'is already fully in the database.')+' Restoring only adds what is missing. It never deletes or overwrites.</p>'+
      '<div class="add-row"><button class="btn soft" data-act="seed-restore"'+(n?'':' disabled')+'>Restore missing records to Turso</button></div>';
  }else s+='<p class="muted">This file has no data saved inside it yet.</p>';
  s+='<div id="seedMsg"></div><p class="muted" style="margin:.8rem 0 .5rem">Download a copy of this whole portal with the database’s current contents built in as JSON. Keep it as your backup: opening it anywhere reconnects to Turso and offers to restore whatever is missing.</p>'+
    '<button class="btn primary" data-act="snapshot-html">Download portal + data (.html)</button></div>';
  return s;
}
function buildPortalSource(snap){
  var root=document.documentElement.cloneNode(true);
  var q=function(s){return root.querySelector(s)};
  var bd=q('#backdrop');if(bd)bd.remove();
  q('#view').innerHTML='';q('#tabs').innerHTML='';
  var tt=q('#toast');tt.innerHTML='';tt.setAttribute('class','toast');
  var sb=q('#seedBar');sb.innerHTML='';sb.setAttribute('hidden','');
  q('#projName').textContent='My House Build';
  q('#syncChip').textContent='⏳ Connecting…';
  q('#roleChip').textContent='🛠️ Admin mode';
  var lb=q('#lockBtn');lb.textContent='';lb.setAttribute('hidden','');lb.setAttribute('data-act','lock');
  q('body').removeAttribute('class');
  q('title').textContent='House Build Tracker';
  q('#hbt-seed').textContent=JSON.stringify(snap).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return '<!DOCTYPE html>\n'+root.outerHTML;
}
async function downloadSnapshotHtml(force){
  if(!isAdmin())return;
  toast('Reading the database…');
  await syncFromRemote();
  if(!force&&SEED){
    var m=seedMissing(),n=m.bills.length+m.labour.length;
    if(n){
      sheet={type:'snapguard'};
      openSheet('Some saved records aren’t in the database','<p>The snapshot inside this file has <b>'+n+'</b> record'+(n===1?'':'s')+' that the database doesn’t have. A new download reflects the database as it is now, so they would not be in the new file.</p><p class="muted" style="margin-top:.6rem">Restore them first if you want to keep them.</p>','<div class="foot-btns"><button class="btn ghost" data-act="snapshot-force">Download anyway</button><button class="btn primary" data-act="seed-restore" data-first>Restore them first</button></div>',true);
      return;
    }
  }
  var snap=Object.assign({format:'house-build-tracker-snapshot',version:1,exportedAt:new Date().toISOString(),source:connected?'turso':'device-copy'},clone(state));
  saveFile('house-build-portal-'+today()+'.html',buildPortalSource(snap),'text/html;charset=utf-8');
  toast(connected?'Downloaded: '+state.bills.length+' bills, '+state.labour.length+' labour payments':'Offline: the file holds this device’s copy');
}

boot();
